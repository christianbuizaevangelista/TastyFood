<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasty Food Manufacturing Inc.</title>
    <meta name="description" content="Tasty Food Manufacturing Inc. — makers of JuanPalaman spreads." />
    <!-- Open Graph / link previews. These are the DEFAULT tags; the build step
         (scripts/og-pages.mjs) writes per-page copies (shop.html, join.html)
         with their own title/description/image, and vercel.json routes the
         public pages to them so each shared link previews correctly. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tasty Food Manufacturing Inc." />
    <meta property="og:title" content="Tasty Food Manufacturing Inc." />
    <meta property="og:description" content="Makers of JuanPalaman spreads. Order online with free delivery, or join our distributor orientation." />
    <meta property="og:image" content="https://tastyfoodph.vercel.app/og-shop.png" />
    <meta property="og:url" content="https://tastyfoodph.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
